services:
  app:
    image: ghcr.io/yukkcat/chatgpt2api:latest
    container_name: chatgpt2api
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json
    environment:
      STORAGE_BACKEND: sqlite
      DATABASE_URL: sqlite:////app/data/accounts.db
      TZ: Asia/Shanghai
